{% extends "base.html" %}
{% block title %}Register — ModelTrack{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Create account</h3>
        <form method="post">
          <div class="mb-2"><label>Username</label>
            <input name="username" class="form-control" value="{{ form.username or '' }}" required></div>
          <div class="mb-2"><label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ form.email or '' }}" required></div>
          <div class="mb-2"><label>Full name</label>
            <input name="full_name" class="form-control" value="{{ form.full_name or '' }}"></div>
          <div class="mb-2"><label>Password</label>
            <input type="password" name="password" class="form-control" required></div>
          <div class="mb-2"><label>Confirm password</label>
            <input type="password" name="password2" class="form-control" required></div>
          <button class="btn btn-primary w-100 mt-2">Register</button>
        </form>
        <hr>
        <a href="{{ url_for('auth.login') }}">Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
